repos:
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.6.0 
    hooks:
      - id: clang-format
        args: ["--style=file"]
        types_or: ["c++", "c"]
        exclude: '^third_party/.*$'
      - id: clang-tidy
        args: ["--config-file=.clang-tidy", "-p=build"]
        types_or: ["c++", "c"]
        exclude: '^third_party/.*$'